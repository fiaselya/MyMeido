pluginManagement {
    repositories {
        // ★ 阿里云镜像放最前：本机走 Clash 出口时 repo.maven.apache.org /
        //   plugins.gradle.org 会 403（出口 IP 被拒），镜像不受影响
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        maven {
            name = 'AliyunGradlePlugin'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        // Stonecutter 插件（dev.kikugie.stonecutter）的发布仓库
        maven {
            name = 'KikuGie'
            url = 'https://maven.kikugie.dev/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
    // 这个工程用 Groovy DSL（build.gradle / stonecutter.gradle），
    // Stonecutter 默认按 Kotlin 控制器处理，必须显式关掉。
    kotlinController = false
    centralScript = "build.gradle"

    // ★ build.gradle 会按注册的节点逐个求值 —— 没适配完的版本别往这里加。
    //   neoforge-1.21.1 是多加载器节点（同一 MC 版本多节点），注册方式见
    //   versions/neoforge-1.21.1/README.md。
    create(getRootProject()) {
        versions '1.21.1', '1.21.11'
        vcsVersion = '1.21.1'
    }
}

rootProject.name = 'mymeido'
