plugins {
    // 1.14.x：接得住 1.21.1 与 1.21.11 两个节点（1.11 接不住 0.141+ 的 fabric-api
    // javadoc intermediary 校验）；官方 Stonecutter 模板对这两个 MC 版本也用这条线
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// 客户端 / 公共端代码分离。
// 为什么需要：NPC 是「真实实体」，必须在服务端（单人游戏的内置服务端）也注册，
// 所以 fabric.mod.json 的 environment 用 "*"；而渲染器、皮肤、粒子这类
// 只存在于客户端的类，放在 src/client 里，服务端不会去加载它们。
// ★ Stonecutter 之后，这份脚本是在 versions/<版本>/ 子工程里求值的，
//   Loom 默认的运行目录会落到 versions/<版本>/run —— 冒烟脚本（tools/smoke3*.py）
//   和开发实例全都钉死了工程根的 run/，必须显式指回去。
//   ★ 只能用相对路径：给绝对路径 Loom 会把开头的 "/" 丢掉再拼
//     （曾生成过 versions/1.21.1/Users/... 这种怪目录）。
loom {
    splitEnvironmentSourceSets()

    mods {
        "mymeido" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        server {
            runDir "../../run"
        }
        client {
            runDir "../../run"
        }
    }
}

repositories {
    // ★ 阿里云镜像在前（本机直连 Maven Central 会 403）
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    // ★ 多版本：fabric.mod.json 的 minecraft 依赖范围必须跟着节点走，
    //   写死 1.21.1 的话 1.21.11 的 jar 会被 FabricLoader 判不兼容直接拒载。
    //   build.gradle 是按节点求值的，stonecutter.current.version 即本节点 MC 版本。
    inputs.property "mcversion", stonecutter.current.version
    // ★ 配方 ingredient 格式分版本：1.21.2 起从 {"item": …} 对象改成纯字符串
    //   （1.21.1 不认字符串、1.21.11 不认对象，双向不兼容；stonecutter 又不预处理
    //   .json 资源，所以走 expand 模板 —— 与 ${mcversion} 同机制）。
    def v = stonecutter.current.version.split('\\.').collect { it.toInteger() }
    def newStyle = (v[0] > 1) || (v[1] > 21) || (v[1] == 21 && v[2] >= 2)
    inputs.property "newIngredient", newStyle
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version,
                "mcversion": inputs.properties.mcversion
    }
    filesMatching("data/mymeido/recipe/meido_contract.json") {
        expand "ing_nether_star": newStyle ? '"minecraft:nether_star"' : '{"item": "minecraft:nether_star"}',
                "ing_paper": newStyle ? '"minecraft:paper"' : '{"item": "minecraft:paper"}'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ---------------------------------------------------------------------------
// 一条命令构建 + 部署，免得「build 完忘了拷 jar」——
// 那种症状是「改了代码进游戏发现没变」，然后去 debug 一个根本不存在的问题。
//
//   ./gradlew deployMod
//   ./gradlew deployMod -PmodsDir="/path/to/another/.minecraft/mods"
//
// 默认指向 macOS 官方启动器的游戏目录（HMCL 也认这个目录）。
// ---------------------------------------------------------------------------
tasks.register("deployMod") {
    group = "mymeido"
    description = "构建并把 remap 后的 jar 拷进 <游戏目录>/mods/"

    dependsOn "build"

    doLast {
        def modsDir = providers.gradleProperty("modsDir").map { file(it) }.getOrElse(
                file("${System.getProperty("user.home")}/Library/Application Support/minecraft/mods"))

        if (!modsDir.isDirectory()) {
            throw new GradleException("mods 目录不存在：${modsDir}（可用 -PmodsDir=<路径> 指定）")
        }

        // ★ 必须拷 remap 之后的生产 jar：Loom 的 remapJar 直接覆盖 build/libs/<name>-<ver>.jar。
        //   别拷 -sources.jar / -dev.jar，那两个进了游戏会炸。
        def jar = layout.buildDirectory
                .file("libs/${base.archivesName.get()}-${project.version}.jar").get().asFile
        if (!jar.isFile()) {
            throw new GradleException("找不到构建产物：${jar}")
        }

        // 先清旧 jar：版本号一变就会残留两个，游戏会报 mod id 重复。
        delete fileTree(modsDir) { include "${base.archivesName.get()}-*.jar" }
        copy {
            from jar
            into modsDir
        }
        logger.lifecycle("已部署 ${jar.name}（${jar.length()} B）-> ${modsDir}")
    }
}

// ---------------------------------------------------------------------------
// ★ stonecutter 0.9 源目录接线（2026-09-21 用探针 + 反编译插件字节码查实）：
//
// stonecutter 会在「比 build.gradle 求值更晚」的阶段重设每个版本节点的
// srcDirs（连 afterEvaluate 里改的都会被它覆盖回去）：
//   活动节点   -> [versions/<v>/src/<set>/java, 根 src/<set>/java]
//                 —— 活动节点设计上就是 raw 编译根 src（stonecutter 的
//                 「根 src 始终处于活动版本方言」模型，靠 IDE 插件 /
//                 stonecutterSwitchTo 物理改写根 src 来维护）；
//   非活动节点 -> [versions/<v>/src/<set>/java（不存在，javac 忽略）,
//                 versions/<v>/build/generated/stonecutter/<set>/java]
//
// 我们是纯 CLI 工作流（无 IDE 插件），根 src 里两个版本的 //? 分支**同时在
// 场**，活动节点 raw 编译必炸（实测 144 错）。所以必须在 stonecutter 接线
// 之后再把源目录扳回来 —— afterEvaluate 不够晚，用 projectsEvaluated。
//
// 另外注意任务依赖：完整预处理输出由 :<v>:stonecutterGenerate 产出，
// 不是 stonecutterPrepare —— 活动节点的 Prepare 只写增量缓存
// stonecutter-cache/sources（只含带 //? 标记的文件），拿它当编译源
// = 空目录编译（2026-09-21 实测，jar 仅 6.9KB、0 个 class）。
//
// 最终策略：所有节点一律只编 build/generated/stonecutter/<set>/java，
// 且 compileJava / compileClientJava 显式 dependsOn stonecutterGenerate(Client)，
// 保证 clean / CI 冷启动 / SwitchTo 换活动版本后行为都一致。
// ---------------------------------------------------------------------------
def nodeProject = project
gradle.projectsEvaluated {
    def ssNames = []
    ['main', 'client'].each { ssName ->
        def ss = nodeProject.sourceSets.findByName(ssName)
        if (ss != null) {
            def genDir = new File(nodeProject.projectDir, "build/generated/stonecutter/${ssName}/java")
            ss.java.setSrcDirs([genDir])
            ssNames << ssName
        }
    }
    // sourcesJar 也会读 srcDirs（= 生成目录，是 stonecutterGenerate 的输出），
    // 必须同样声明依赖，否则 Gradle 隐式依赖校验直接 fail（9.x 默认 error）。
    nodeProject.tasks.matching {
        it.name in ['compileJava', 'compileClientJava', 'sourcesJar']
    }.configureEach {
        dependsOn 'stonecutterGenerate', 'stonecutterGenerateClient'
    }
    nodeProject.logger.lifecycle("[mymeido] {} 节点编译源已固定为 stonecutter 生成目录: {}",
            nodeProject.name, ssNames)
}
