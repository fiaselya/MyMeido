# ============ Gradle ============
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Groovy build script 消音（Stonecutter 会对 .gradle 打「Groovy 支持有限」的提示）
dev.kikugie.stonecutter.hard_mode=true

# JDK 21 的位置从这个文件里拿掉，改成可移植写法：
#   · 机器上有系统 Java / JAVA_HOME 已指向 21 → 什么都不用配；
#   · macOS 这类「装了但没注册」的情况 → 在 **用户级** 配置文件里指一次即可：
#         ~/.gradle/gradle.properties     ← 不要写进仓库
#         org.gradle.java.home=/path/to/jdk-21
# （本机那行实际写在 ~/.gradle/gradle.properties 里，不进仓库）
# org.gradle.java.home=

# ============ Mod 自身（所有版本共用） ============
# 各 MC 版本专属的依赖（minecraft/yarn/loader/fabric_api）在 versions/<版本>/gradle.properties
mod_version=0.3.0
maven_group=com.mymeido
archives_base_name=mymeido
