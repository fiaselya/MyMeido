# ============ Gradle ============
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# JDK 21 的位置从这个文件里拿掉，改成可移植写法：
#   · 机器上有系统 Java / JAVA_HOME 已指向 21 → 什么都不用配；
#   · macOS 这类「装了但没注册」的情况 → 在 **用户级** 配置文件里指一次即可：
#         ~/.gradle/gradle.properties     ← 不要写进仓库
#         org.gradle.java.home=/path/to/jdk-21
# （本机那行实际写在 ~/.gradle/gradle.properties 里，不进仓库）
# org.gradle.java.home=

